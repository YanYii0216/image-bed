<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的图床</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:#333;
}
.box{
  width:100%;
  max-width:520px;
  background:#fff;
  padding:28px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}
h1{
  margin:0 0 8px;
  font-size:24px;
}
.tip{
  margin:0 0 24px;
  color:#888;
  font-size:14px;
}
label{
  display:block;
  margin:16px 0 7px;
  font-size:14px;
  font-weight:600;
}
input[type="text"],
input[type="password"],
input[type="file"]{
  width:100%;
  padding:11px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fafafa;
}
button{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:15px;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
#status{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  background:#f7f7f7;
  font-size:14px;
  line-height:1.6;
  word-break:break-all;
}
#result{
  margin-top:12px;
  word-break:break-all;
}
#result a{
  color:#1677ff;
}
</style>
</head>

<body>
<div class="box">
  <h1>📷 我的图床</h1>
  <p class="tip">上传图片到 GitHub，自动生成图片链接</p>

  <label>GitHub 用户名</label>
  <input id="username" type="text" placeholder="例如：yanyii0216">

  <label>仓库名</label>
  <input id="repo" type="text" value="image-bed">

  <label>私人令牌</label>
  <input id="token" type="password" placeholder="只在这里输入，不要发给别人">

  <label>选择图片</label>
  <input id="file" type="file" accept="image/*">

  <button id="upload">上传图片</button>

  <div id="status">等待上传……</div>
  <div id="result"></div>
</div>

<script>
const uploadBtn = document.getElementById("upload");
const status = document.getElementById("status");
const result = document.getElementById("result");

uploadBtn.onclick = async () => {
  const username = document.getElementById("username").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const token = document.getElementById("token").value.trim();
  const fileInput = document.getElementById("file");
  const file = fileInput.files[0];

  if (!username || !repo || !token || !file) {
    status.textContent = "请把用户名、仓库名、令牌和图片都填写好。";
    return;
  }

  uploadBtn.disabled = true;
  status.textContent = "正在上传……";
  result.innerHTML = "";

  try {
    const arrayBuffer = await file.arrayBuffer();
    const bytes = new Uint8Array(arrayBuffer);

    let binary = "";
    const chunkSize = 0x8000;

    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(
        ...bytes.subarray(i, i + chunkSize)
      );
    }

    const base64 = btoa(binary);

    const ext = file.name.includes(".")
      ? file.name.substring(file.name.lastIndexOf("."))
      : "";

    const filename =
      Date.now() +
      "-" +
      Math.random().toString(36).slice(2, 8) +
      ext;

    const path = "images/" + filename;

    const response = await fetch(
      `https://api.github.com/repos/${username}/${repo}/contents/${path}`,
      {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Upload image: " + filename,
          content: base64
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.message || "GitHub 上传失败"
      );
    }

    const imageUrl =
      `https://${username}.github.io/${repo}/${path}`;

    status.textContent = "✅ 上传成功！";

    result.innerHTML =
      `<a href="${imageUrl}" target="_blank">${imageUrl}</a>`;

  } catch (error) {
    status.textContent = "❌ 上传失败：" + error.message;
  } finally {
    uploadBtn.disabled = false;
  }
};
</script>

</body>
</html>
